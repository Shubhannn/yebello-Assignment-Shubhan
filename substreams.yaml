specVersion: v0.1.0
package:
  name: solana_transfers
  version: v0.1.0

imports:
  solana: https://spkg.io/streamingfast/solana-common-v0.3.0.spkg

protobuf:
  files:
    - transfers.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/solana_transfers.wasm

modules:
  - name: map_transfers
    kind: map
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:solana.transfers.v1.Transfers
